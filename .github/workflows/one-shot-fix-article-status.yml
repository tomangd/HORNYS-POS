name: One-shot article status fix

on:
  push:
    branches:
      - refactor/hornys-pos-v3

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: accept common article active statuses'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/hornys-pos-v3
          fetch-depth: 1

      - name: Patch article status parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Code.js')
          text = path.read_text(encoding='utf-8')
          old = '''function interpreterStatutActif(rawValue) {
  if (rawValue === "" || rawValue === null || rawValue === undefined)
    return true;
  if (typeof rawValue === "boolean") return rawValue;
  return ["ACTIF", "TRUE", "1"].indexOf(String(rawValue).toUpperCase()) >= 0;
}'''
          new = '''function interpreterStatutActif(rawValue) {
  if (rawValue === "" || rawValue === null || rawValue === undefined)
    return true;
  if (typeof rawValue === "boolean") return rawValue;
  const value = String(rawValue).trim().toUpperCase();
  if (["ACTIF", "TRUE", "1", "OUI", "YES", "ON"].indexOf(value) >= 0)
    return true;
  if (["INACTIF", "FALSE", "0", "NON", "NO", "OFF"].indexOf(value) >= 0)
    return false;
  return false;
}'''
          if old not in text:
              raise SystemExit('Expected interpreterStatutActif implementation was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-fix-article-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Code.js .github/workflows/one-shot-fix-article-status.yml
          git commit -m 'fix: accept common article active statuses'
          git push origin HEAD:refactor/hornys-pos-v3
