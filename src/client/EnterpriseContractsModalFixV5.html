<script>
/** HORNYS-POS V5 — canonical enterprise contract selector. */
(function(){'use strict';
  window.ouvrirSelectionContrat=function(){
    var modal=document.getElementById('contratModal'),list=document.getElementById('contratSelectionList');if(!modal||!list)return;
    modal.classList.remove('hidden');modal.style.zIndex='10000';list.innerHTML='<div style="padding:14px;color:#9ca3af">Chargement des contrats entreprise…</div>';
    google.script.run.withSuccessHandler(function(data){
      var contracts=Array.isArray(data)?data.filter(function(c){return c&&c.id;}):[];
      window.contratsData=contracts;
      if(!contracts.length){list.innerHTML='<div style="padding:14px;color:#fbbf24">Aucun contrat entreprise trouvé dans l’onglet CONTRATS.</div>';return;}
      list.innerHTML=contracts.map(function(c){var name=c.companyName||('Entreprise #'+c.companyId),type=String(c.contractType||c.type||'Contrat').replace(/_/g,' ');return '<button type="button" class="btn-select contrat-option-v5" data-id="'+esc_(c.id)+'" style="width:100%;margin-bottom:8px;text-align:left;display:block"><strong>'+esc_(name)+'</strong><br><span>'+esc_(type)+'</span> <small>· '+esc_(c.status||'ACTIF')+'</small></button>';}).join('');
      list.querySelectorAll('.contrat-option-v5').forEach(function(btn){btn.onclick=function(){if(typeof window.selectionnerContrat==='function')window.selectionnerContrat(btn.dataset.id);};});
    }).withFailureHandler(function(e){list.innerHTML='<div style="padding:14px;color:#fca5a5">Impossible de charger les contrats : '+esc_(e&&e.message||e)+'</div>';}).contratsEntreprisesV6();
  };
  function esc_(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');}
})();
</script>
