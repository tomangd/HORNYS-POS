<script>
/** HORNYS-POS V3 — compatibility facade. Canonical implementation lives in CheckoutBridgeV3. */
(function () {
  'use strict';
  window.POSPaymentV3 = {
    submit: function (payload, success, failure) {
      if (!window.POSCheckoutV3 || typeof POSCheckoutV3.submit !== 'function') {
        if (typeof failure === 'function') failure(new Error('Le moteur de caisse V3 n’est pas chargé.'));
        return false;
      }
      return POSCheckoutV3.submit(payload, success, failure);
    },
    newId: function () {
      return (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'POS-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    }
  };
})();
</script>
